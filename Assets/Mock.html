<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stonebot UI</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            background-color: #1e1e2e;
            color: #fff;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            background-color: #2a2a40;
        }

        .title-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .connect-btn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .controls {
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }

        .search-bar {
            margin-bottom: 1rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.5rem;
            font-size: 1rem;
            border-radius: 4px;
            border: none;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .tab {
            padding: 0.5rem 1rem;
            background-color: #3a3a50;
            border-radius: 4px;
            cursor: pointer;
        }

            .tab.active {
                background-color: #4caf50;
            }

        .tab-content {
            display: none;
        }

            .tab-content.active {
                display: block;
            }

        .category-heading {
            margin: 1rem 0 0.5rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: #aaa;
        }

        .commands-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
        }

        .command-card {
            background-color: #2e2e3e;
            border-radius: 8px;
            padding: 1rem;
            position: relative;
        }

        .command-title {
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .power-btn {
            background: none;
            border: none;
            color: #4caf50;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .command-field {
            margin: 0.5rem 0;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 0.4rem;
            border-radius: 4px;
            border: none;
            background-color: #444;
            color: white;
        }

        .no-commands {
            text-align: center;
            padding: 2rem;
            font-style: italic;
            color: #aaa;
        }
    </style>
</head>
<body>
    <header>
        <div class="title-section">
            <h1>Stonebot</h1>
            <button class="connect-btn">Connect</button>
        </div>
        <div>
            <button class="connect-btn">⚙ Settings</button>
        </div>
    </header>
    <div class="controls">
        <div class="search-bar">
            <input type="text" placeholder="Search commands...">
        </div>
        <div class="tabs">
            <div class="tab active" data-tab="commands">Commands</div>
            <div class="tab" data-tab="messages">Messages</div>
            <div class="tab" data-tab="timers">Timers</div>
        </div>

        <div id="commands" class="tab-content active">
            <div class="category-heading">Links</div>
            <div class="commands-grid">
                <div class="command-card">
                    <div class="command-title">
                        !discord
                        <button class="power-btn">⏻</button>
                    </div>
                    <div class="command-field">
                        <label>Permission Level:</label>
                        <select><option>Everyone</option><option>Mods</option><option>Broadcaster</option></select>
                    </div>
                    <div class="command-field">
                        <label>Category:</label>
                        <select><option>Links</option><option>Fun</option><option>Info</option></select>
                    </div>
                    <div class="command-field">
                        <label>Use Delay (seconds):</label>
                        <input type="number" value="30">
                    </div>
                </div>

                <div class="command-card">
                    <div class="command-title">
                        !youtube
                        <button class="power-btn">⏻</button>
                    </div>
                    <div class="command-field">
                        <label>Permission Level:</label>
                        <select><option>Everyone</option><option>Mods</option><option>Broadcaster</option></select>
                    </div>
                    <div class="command-field">
                        <label>Category:</label>
                        <select><option>Links</option><option>Fun</option><option>Info</option></select>
                    </div>
                    <div class="command-field">
                        <label>Use Delay (seconds):</label>
                        <input type="number" value="45">
                    </div>
                </div>
            </div>

            <div class="category-heading">Fun</div>
            <div class="commands-grid">
                <div class="command-card">
                    <div class="command-title">
                        !joke
                        <button class="power-btn">⏻</button>
                    </div>
                    <div class="command-field">
                        <label>Permission Level:</label>
                        <select><option>Everyone</option><option>Mods</option><option>Broadcaster</option></select>
                    </div>
                    <div class="command-field">
                        <label>Category:</label>
                        <select><option>Links</option><option>Fun</option><option>Info</option></select>
                    </div>
                    <div class="command-field">
                        <label>Use Delay (seconds):</label>
                        <input type="number" value="1200">
                    </div>
                </div>
            </div>

            <div class="category-heading">Info</div>
            <div class="commands-grid">
                <div class="command-card">
                    <div class="command-title">
                        !uptime
                        <button class="power-btn">⏻</button>
                    </div>
                    <div class="command-field">
                        <label>Permission Level:</label>
                        <select><option>Everyone</option><option>Mods</option><option>Broadcaster</option></select>
                    </div>
                    <div class="command-field">
                        <label>Category:</label>
                        <select><option>Links</option><option>Fun</option><option>Info</option></select>
                    </div>
                    <div class="command-field">
                        <label>Use Delay (seconds):</label>
                        <input type="number" value="10">
                    </div>
                </div>
            </div>

            <div class="no-commands" style="display: none;">
                No commands found.
            </div>
        </div>

        <div id="messages" class="tab-content">
            <div class="category-heading">Messages</div>
            <div class="commands-grid">
                <div class="command-card">
                    Placeholder message config here...
                </div>
            </div>
        </div>

        <div id="timers" class="tab-content">
            <div class="category-heading">Timers</div>
            <div class="commands-grid">
                <div class="command-card">
                    Placeholder timer config here...
                </div>
            </div>
        </div>
    </div>

    <script>
    const searchInput = document.querySelector('.search-bar input');
        const noCommandsMessage = document.querySelector('.no-commands');
        const commandCards = document.querySelectorAll('#commands .command-card');
        const tabs = document.querySelectorAll('.tab');
        const tabContents = document.querySelectorAll('.tab-content');

        function updateCommandVisibility() {
            const query = searchInput.value.trim().toLowerCase();
            let visibleCount = 0;

            commandCards.forEach(card => {
                const title = card.querySelector('.command-title').textContent.toLowerCase();
                if (title.includes(query)) {
                    card.style.display = '';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            noCommandsMessage.style.display = visibleCount === 0 ? 'block' : 'none';
        }

        searchInput.addEventListener('input', updateCommandVisibility);

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tabContents.forEach(tc => tc.classList.remove('active'));

                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
            });
        });</script>
</body>
</html>
